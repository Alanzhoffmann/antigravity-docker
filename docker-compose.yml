services:
  antigravity-bot:
    build: .
    container_name: antigravity_coordinator
    ports:
      - "8080:8080"
    volumes:
      # Persist the global Antigravity token and preferences across all dynamic sessions
      - /home/user/antigravity-bot/.config/antigravity:/root/.config/antigravity
      - /home/user/antigravity-bot/.local/share:/root/.local/share
      
      # Persist the GitHub workspaces
      - /home/user/antigravity-bot/workspaces:/app/workspaces
    restart: unless-stopped