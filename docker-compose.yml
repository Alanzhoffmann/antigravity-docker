services:
  antigravity-bot:
    build: .
    container_name: antigravity_coordinator
    ports:
      - "5555:8080"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      # Persist the global Antigravity token and preferences across all dynamic sessions
      - ${DOCKER_DIR}/config/antigravity-bot/.config/antigravity:/root/.config/antigravity
      - ${DOCKER_DIR}/config/antigravity-bot/.local/share:/root/.local/share
      
      # Persist the GitHub workspaces
      - ${DOCKER_DIR}/config/antigravity-bot/workspaces:/app/workspaces
    restart: unless-stopped